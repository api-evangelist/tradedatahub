domain_standard:
  market: US B2B contractor / trade-business firmographic data
  standard_declared: false
  evidence:
    location: openapi/tradedatahub-openapi.json + https://www.tradedatahub.net/data-quality/
    detail: >-
      The contract declares no domain data standard for its market. Record fields (Name, Phone,
      Website, Address, Category, City, State, last_verified_date) are bespoke; trade categories and
      product_id slugs are a TradeDataHub-local vocabulary. No NAICS/SIC code, no schema.org
      LocalBusiness typing, no DUNS/LEI identifier scheme, and no OpenReferral or comparable business-
      directory standard appears anywhere in the spec, the API responses or the data-quality page.
  penalty: none
  note: >-
    REWARD-ONLY dimension. Recorded as absent, not invented. The nearest applicable standards would be
    schema.org/LocalBusiness typing on records or NAICS classification of the trade taxonomy; neither
    is claimed by the provider and neither is asserted here.
compliance:
  certifications_published: []
  trust_center: false
  note: >-
    No SOC 2, ISO 27001, PCI, HIPAA or comparable certification is claimed anywhere on the site.
    probe-security-programs.py returned vdp=none trust=none. The terms and privacy pages place
    compliance obligations (TCPA, CAN-SPAM, state privacy laws) on the BUYER, and explicitly state
    that inclusion in a dataset is not consent to be contacted.
