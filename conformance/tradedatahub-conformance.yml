name: TradeDataHub standards conformance
description: >-
  Standards and cross-cutting conventions asserted against the TradeDataHub Public API, each with the
  evidence that supports or refutes it. Absence is recorded as conforms:false rather than omitted.
conformance:
  - id: openapi-3.1
    conforms: true
    evidence:
      location: openapi/tradedatahub-openapi.json (info/openapi)
      detail: 'openapi: "3.1.0" with 11 documented GET operations across 3 tags and 11 component schemas.'
      url: https://www.tradedatahub.net/openapi.json
      http_status: 200
  - id: llmstxt
    conforms: true
    evidence:
      location: https://www.tradedatahub.net/llms.txt
      detail: >-
        Served as text/plain, follows the llms.txt convention (H1 title, blockquote summary, H2
        sections of linked resources). A companion llms-full.txt is also served.
      http_status: 200
  - id: x402
    conforms: true
    version: 2
    evidence:
      location: GET /api/v1/datasets/{product_id}/download
      detail: >-
        An unpaid request returns HTTP 402 carrying a base64 Payment-Required header and a body
        payment_required object with x402Version 2, accepts[] {scheme exact, network eip155:84532,
        amount, asset, payTo, maxTimeoutSeconds}, and extensions{}. Probed anonymously without paying.
      url: https://www.tradedatahub.net/api/v1/datasets/state:california/download
      http_status: 402
    caveat: >-
      TESTNET ONLY. Network is Base Sepolia (eip155:84532) with testnet USDC; the provider states
      mainnet settlement is NOT enabled. This is a real x402 implementation but not production commerce.
  - id: rfc9457
    conforms: false
    evidence:
      location: components.schemas.Error
      detail: >-
        Errors use a proprietary {api_version, error:{code,message}} envelope served as
        application/json. No application/problem+json media type and no type/title/status/detail members.
  - id: pagination
    conforms: true
    evidence:
      location: GET /api/v1/datasets, GET /api/v1/cities
      detail: >-
        limit/offset query parameters (limit 1..100, default 100; offset >= 0) with a pagination
        object {total, limit, offset} in every list response. Verified live.
    caveat: >-
      The declared 400 for an out-of-range limit does not fire — limit=9999 returned HTTP 200 with
      limit clamped to 100.
  - id: idempotency
    conforms: na
    evidence:
      location: openapi/tradedatahub-openapi.json (paths)
      detail: >-
        All 11 operations are GET and therefore idempotent by HTTP semantics. There is no unsafe write
        surface, so an Idempotency-Key mechanism has nothing to protect.
  - id: oauth2
    conforms: false
    evidence:
      location: components.securitySchemes
      detail: >-
        No securitySchemes are declared at all. /.well-known/oauth-authorization-server and
        /.well-known/oauth-protected-resource both returned 404.
  - id: oidc
    conforms: false
    evidence:
      location: /.well-known/openid-configuration
      detail: Returned HTTP 404 (site HTML 404 page).
  - id: cors
    conforms: true
    evidence:
      location: live response headers
      detail: >-
        access-control-allow-origin *, allow-methods GET/HEAD/OPTIONS, allow-headers including
        Payment-Signature, expose-headers Payment-Required and Payment-Response. Browser and agent
        clients can call the discovery API cross-origin without a proxy.
      url: https://www.tradedatahub.net/api/v1/coverage
      http_status: 200
  - id: hsts
    conforms: true
    evidence:
      location: live response headers
      detail: strict-transport-security max-age=31536000 on TLSv1.3.
  - id: rfc9116-securitytxt
    conforms: false
